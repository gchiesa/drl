[tools]
go = "1.25.6"
golangci-lint = "2.8"
protoc = "29.6"
hugo = "0.160.1"
node = "22"
"go:github.com/swaggo/swag/cmd/swag" = "v1.16.4"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "v1.6.2"

[tasks.build]
description = "Build the DRL binary"
run = "./ci/scripts/build.sh"

[tasks.test]
description = "Run tests with coverage"
run = "./ci/scripts/test.sh"

[tasks.lint]
description = "Run linting"
run = "./ci/scripts/lint.sh"

[tasks.proto-gen]
description = "Generate Go code from protobuf definitions"
run = "./ci/scripts/proto-gen.sh"

[tasks.test-functional]
description = "Run functional test suite (docker compose + k6)"
run = "./ci/scripts/test-functional.sh"

[tasks.test-performance]
description = "Run performance test suite (docker compose + k6)"
run = "./ci/scripts/test-performance.sh"

[tasks.test-handover]
description = "Run handover functional test (docker compose + k6)"
run = "./ci/scripts/test-handover.sh"

[tasks.docs-build]
description = "Build Hugo documentation site (output: docs/public/)"
run = "./ci/scripts/docs-build.sh"

[tasks.docs-serve]
description = "Serve Hugo documentation site locally with live reload"
run = "hugo server --disableFastRender --source docs"
