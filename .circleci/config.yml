version: 2.1

executors:
  docker-executor:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    resource_class: medium

commands:
  setup-mise:
    description: "Install mise and project tools (with cache)"
    steps:
      - restore_cache:
          name: Restore mise tool cache
          keys:
            - mise-v1-{{ checksum "mise.toml" }}
            - mise-v1-
      - run:
          name: Install mise
          command: |
            if [ ! -f ~/.local/bin/mise ]; then
              curl https://mise.run | sh
            fi
            echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$BASH_ENV"
      - run:
          name: Install tools via mise
          command: mise install
      - save_cache:
          name: Save mise tool cache
          key: mise-v1-{{ checksum "mise.toml" }}
          paths:
            - ~/.local/share/mise
            - ~/.local/bin/mise

  restore-go-cache:
    description: "Restore Go module and build cache"
    steps:
      - restore_cache:
          name: Restore Go module cache
          keys:
            - gomod-v1-{{ checksum "go.sum" }}
            - gomod-v1-

  save-go-cache:
    description: "Save Go module and build cache"
    steps:
      - save_cache:
          name: Save Go module cache
          key: gomod-v1-{{ checksum "go.sum" }}
          paths:
            - ~/go/pkg/mod
            - ~/.cache/go-build

  pull-test-images:
    description: "Pull third-party images used by test suites"
    steps:
      - run:
          name: Pull test infrastructure images
          command: |
            docker pull mccutchen/go-httpbin:latest &
            docker pull envoyproxy/envoy:v1.30-latest &
            docker pull grafana/k6:latest &
            wait

  run-functional-scenario:
    description: "Run a single functional test scenario"
    parameters:
      label:
        type: string
      replicas:
        type: integer
      allowed_threshold:
        type: integer
      blocked_threshold:
        type: integer
      wait_seconds:
        type: integer
    steps:
      - run:
          name: "Run scenario: << parameters.label >>"
          command: >-
            ./ci/scripts/test-functional-scenario.sh
            "<< parameters.label >>"
            << parameters.replicas >>
            << parameters.allowed_threshold >>
            << parameters.blocked_threshold >>
            << parameters.wait_seconds >>
          no_output_timeout: 3m
      - run:
          name: Collect logs on failure
          when: on_fail
          command: docker compose -f test-suite/functional/docker-compose.yaml logs drl envoy
      - store_artifacts:
          path: test-suite/functional/results
          destination: functional-test-report

jobs:
  unit-tests:
    executor: docker-executor
    steps:
      - checkout
      - setup-mise
      - restore-go-cache
      - run:
          name: Run linter
          command: mise run lint
      - run:
          name: Run unit tests
          command: mise run test
      - save-go-cache

  functional-single-instance:
    executor: docker-executor
    steps:
      - checkout
      - setup-mise
      - pull-test-images
      - run-functional-scenario:
          label: single-instance
          replicas: 1
          allowed_threshold: 33
          blocked_threshold: 55
          wait_seconds: 10

  functional-5-instances:
    executor: docker-executor
    steps:
      - checkout
      - setup-mise
      - pull-test-images
      - run-functional-scenario:
          label: 5-instances
          replicas: 5
          allowed_threshold: 36
          blocked_threshold: 50
          wait_seconds: 15

  functional-10-instances:
    executor: docker-executor
    steps:
      - checkout
      - setup-mise
      - pull-test-images
      - run-functional-scenario:
          label: 10-instances
          replicas: 10
          allowed_threshold: 38
          blocked_threshold: 45
          wait_seconds: 20

  handover-test:
    executor: docker-executor
    steps:
      - checkout
      - setup-mise
      - pull-test-images
      - run:
          name: Run handover test
          command: mise run test-handover
          no_output_timeout: 5m
      - run:
          name: Collect logs on failure
          when: on_fail
          command: docker compose -f test-suite/handover/docker-compose.yaml logs drl envoy
      - store_artifacts:
          path: test-suite/handover/results
          destination: handover-test-report

  performance-test:
    executor: docker-executor
    resource_class: large
    steps:
      - checkout
      - setup-mise
      - pull-test-images
      - run:
          name: Run performance test suite
          command: mise run test-performance
          no_output_timeout: 10m
      - run:
          name: Collect logs on failure
          when: on_fail
          command: docker compose -f test-suite/performance/docker-compose.yaml logs drl envoy
      - store_artifacts:
          path: test-suite/performance/results
          destination: performance-test-report

workflows:
  merge-request:
    jobs:
      - unit-tests
      - functional-single-instance:
          requires:
            - unit-tests
      - functional-5-instances:
          requires:
            - unit-tests
      - functional-10-instances:
          requires:
            - unit-tests
      - handover-test:
          requires:
            - unit-tests

  main-performance:
    jobs:
      - unit-tests:
          filters:
            branches:
              only: main
      - functional-single-instance:
          requires:
            - unit-tests
          filters:
            branches:
              only: main
      - functional-5-instances:
          requires:
            - unit-tests
          filters:
            branches:
              only: main
      - functional-10-instances:
          requires:
            - unit-tests
          filters:
            branches:
              only: main
      - handover-test:
          requires:
            - unit-tests
          filters:
            branches:
              only: main
      - performance-test:
          requires:
            - functional-single-instance
            - functional-5-instances
            - functional-10-instances
            - handover-test
          filters:
            branches:
              only: main
