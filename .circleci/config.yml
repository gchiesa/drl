version: 2.1

# Dynamic Configuration — this file is the setup stage.
# Actual jobs live in continue_config.yml and are triggered
# with pipeline parameters set by path-filtering below.
#
# PREREQUISITE: Enable "Dynamic Configuration" in the CircleCI
# project settings (Advanced → Enable dynamic config using setup workflows).

setup: true

orbs:
  path-filtering: circleci/path-filtering@1.1.0

executors:
  python39:
    docker:
      - image: cimg/python:3.9

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          base-revision: main
          executor: python39
          config-path: .circleci/continue_config.yml
          mapping: |
            internal/.*       run-code-tests true
            go\.(mod|sum)     run-code-tests true
            main\.go          run-code-tests true
            Dockerfile        run-code-tests true
            mise\.toml        run-code-tests true
            \.circleci/.*     run-code-tests true
            docs/.*           deploy-docs    true
            README\.md        deploy-docs    true
