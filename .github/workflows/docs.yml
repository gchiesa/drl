# Docs Workflow
#
# Builds the Hugo/Hextra documentation site and deploys it to the gh-pages
# branch whenever docs source or the workflow itself changes on main.
#
# Hugo is installed via mise (single Go binary — no npm, no node_modules).
# The Hextra theme is fetched as a Go module (hugo mod get).
#
# The site is served at: https://gchiesa.github.io/drl/
#
# REPOSITORY SETUP REQUIRED (one-time):
#   Settings → Pages → Source: "Deploy from a branch"
#               Branch: gh-pages / (root)
#   Settings → Actions → General → Workflow permissions:
#               "Read and write permissions" (needed by peaceiris/actions-gh-pages)

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"

jobs:
  deploy-docs:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Fetch enough history for Hugo's .GitInfo and lastmod to work correctly.
          fetch-depth: 0

      # mise installs Hugo (and all other project tools) from mise.toml.
      # Hugo is a single static binary — no npm, no package manager involved.
      - name: Install mise and project tools (includes Hugo)
        # jdx/mise-action v2
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac

      # Hugo requires an absolute path for HUGO_CACHEDIR — tilde is not expanded.
      # Export it via GITHUB_ENV so all subsequent steps inherit the resolved value.
      - name: Set Hugo cache directory
        run: echo "HUGO_CACHEDIR=$HOME/.cache/hugo_cache" >> "$GITHUB_ENV"

      - name: Cache Hugo module downloads
        # Cache the Hugo module cache (Go module proxy) to avoid re-fetching
        # the Hextra theme on every run.
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-modules-${{ hashFiles('docs/go.sum') }}
          restore-keys: hugo-modules-

      - name: Fetch Hugo theme (Hextra via Go modules)
        # Equivalent to "go mod download" for Hugo — populates the module cache.
        run: hugo mod get
        working-directory: docs

      - name: Build Hugo docs site
        # Output lands in docs/public/ (Hugo default destination).
        # --minify reduces HTML/CSS/JS size; safe for static sites.
        run: mise run docs-build

      # peaceiris/actions-gh-pages commits docs/public/ to the gh-pages branch.
      # It automatically adds .nojekyll so GitHub Pages serves Hugo's
      # underscore-prefixed asset directories without Jekyll interference.
      - name: Deploy to gh-pages branch
        # peaceiris/actions-gh-pages v4
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc
        with:
          # GITHUB_TOKEN is provided automatically — no extra secret needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Hugo writes output to docs/public/ by default.
          publish_dir: docs/public
          publish_branch: gh-pages
          # GitHub Pages is configured to serve from the docs/ subdirectory
          # of gh-pages, so we place the built site there.
          destination_dir: docs
          commit_message: "docs: deploy GitHub Pages [skip ci]"
          enable_jekyll: false
