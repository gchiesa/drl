# CI Workflow
#
# Triggers on every push (any branch) and pull-request targeting main when
# Go source, tooling, or CI config files are changed.
#
# Job dependency graph:
#
#   lint-and-unit ──┬── functional-single-instance
#                   ├── functional-5-instances
#                   ├── functional-10-instances
#                   └── handover-test
#
# The performance workflow (performance.yml) runs separately on main only,
# gated on this workflow's success via workflow_run.

name: CI

on:
  push:
    # Run on all branches so feature branches get feedback too.
    branches: ["**"]
    paths:
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "main.go"
      - "Dockerfile"
      - "mise.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "main.go"
      - "Dockerfile"
      - "mise.toml"
      - ".github/workflows/ci.yml"

jobs:
  # ── Lint & unit tests ───────────────────────────────────────────────────────
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # mise installs all tooling declared in mise.toml (Go, golangci-lint, protoc …)
      # and caches the tool store between runs automatically.
      - name: Install mise and project tools
        # jdx/mise-action v2
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac

      - name: Cache Go module and build cache
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Cache key changes when go.sum changes; fallback to OS-scoped prefix.
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: gomod-${{ runner.os }}-

      - name: Run linter
        run: mise run lint

      - name: Run unit tests with coverage
        run: mise run test

  # ── Functional tests (run in parallel after lint-and-unit) ─────────────────

  functional-single-instance:
    name: Functional — 1 replica
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install mise and project tools
        # jdx/mise-action v2
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac

      # Pull all test-infrastructure images in parallel to reduce job startup time.
      - name: Pull test infrastructure Docker images
        run: |
          docker pull mccutchen/go-httpbin:latest &
          docker pull envoyproxy/envoy:v1.30-latest &
          docker pull grafana/k6:latest &
          wait

      - name: Run functional scenario (1 replica)
        # Args: label replicas allowed_threshold blocked_threshold wait_seconds
        run: >-
          ./ci/scripts/test-functional-scenario.sh
          "single-instance" 1 33 55 10
        timeout-minutes: 3

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose -f test-suite/functional/docker-compose.yaml logs drl envoy

      - name: Upload test report
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-single-instance-report
          path: test-suite/functional/results/

  functional-5-instances:
    name: Functional — 5 replicas
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install mise and project tools
        # jdx/mise-action v2
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac

      - name: Pull test infrastructure Docker images
        run: |
          docker pull mccutchen/go-httpbin:latest &
          docker pull envoyproxy/envoy:v1.30-latest &
          docker pull grafana/k6:latest &
          wait

      - name: Run functional scenario (5 replicas)
        run: >-
          ./ci/scripts/test-functional-scenario.sh
          "5-instances" 5 36 50 15
        timeout-minutes: 3

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose -f test-suite/functional/docker-compose.yaml logs drl envoy

      - name: Upload test report
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-5-instances-report
          path: test-suite/functional/results/

  functional-10-instances:
    name: Functional — 10 replicas
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install mise and project tools
        # jdx/mise-action v2
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac

      - name: Pull test infrastructure Docker images
        run: |
          docker pull mccutchen/go-httpbin:latest &
          docker pull envoyproxy/envoy:v1.30-latest &
          docker pull grafana/k6:latest &
          wait

      - name: Run functional scenario (10 replicas)
        run: >-
          ./ci/scripts/test-functional-scenario.sh
          "10-instances" 10 38 45 20
        timeout-minutes: 3

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose -f test-suite/functional/docker-compose.yaml logs drl envoy

      - name: Upload test report
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-10-instances-report
          path: test-suite/functional/results/

  # ── Handover test ───────────────────────────────────────────────────────────
  handover-test:
    name: Handover Test
    needs: lint-and-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install mise and project tools
        # jdx/mise-action v2
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac

      - name: Pull test infrastructure Docker images
        run: |
          docker pull mccutchen/go-httpbin:latest &
          docker pull envoyproxy/envoy:v1.30-latest &
          docker pull grafana/k6:latest &
          wait

      - name: Run handover test
        # Verifies that a new node correctly inherits blocklist state from peers.
        run: mise run test-handover
        timeout-minutes: 5

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose -f test-suite/handover/docker-compose.yaml logs drl envoy

      - name: Upload test report
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handover-test-report
          path: test-suite/handover/results/

  # ── Publish HTML reports to GitHub Pages (main branch only) ────────────────
  #
  # Runs after all test jobs regardless of their outcome so reports from
  # partially-failed runs are still published. Uses keep_files: true so
  # this deploy doesn't wipe the Hugo documentation deployed by docs.yml.
  deploy-reports:
    name: Publish CI Reports
    needs:
      - functional-single-instance
      - functional-5-instances
      - functional-10-instances
      - handover-test
    # Only publish from main; skip on pull-request builds.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Download each test artifact into its own subdirectory so they land at
      # separate URLs under /reports/ on the published site.
      - name: Download functional-single-instance report
        # actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: functional-single-instance-report
          path: /tmp/reports/functional-single-instance/

      - name: Download functional-5-instances report
        # actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: functional-5-instances-report
          path: /tmp/reports/functional-5-instances/

      - name: Download functional-10-instances report
        # actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: functional-10-instances-report
          path: /tmp/reports/functional-10-instances/

      - name: Download handover report
        # actions/download-artifact v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: handover-test-report
          path: /tmp/reports/handover/

      # Copy each directory's first HTML file to index.html so GitHub Pages
      # serves it at a clean URL (e.g. /reports/handover/) without the filename.
      - name: Normalise report filenames to index.html
        run: |
          for dir in /tmp/reports/*/; do
            html=$(find "$dir" -maxdepth 1 -name "*.html" | sort | head -1)
            if [ -n "$html" ] && [ "$(basename "$html")" != "index.html" ]; then
              cp "$html" "$(dirname "$html")/index.html"
            fi
          done

      # keep_files: true prevents this deploy from deleting the Hugo docs that
      # docs.yml publishes to the same gh-pages branch under docs/.
      - name: Deploy reports to gh-pages (docs/reports/)
        # peaceiris/actions-gh-pages v4
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/reports
          publish_branch: gh-pages
          # Nest under docs/ to match the GitHub Pages source directory.
          destination_dir: docs/reports
          # Do not wipe existing content (Hugo docs live alongside reports).
          keep_files: true
          commit_message: "ci: publish test reports [skip ci]"
          enable_jekyll: false
