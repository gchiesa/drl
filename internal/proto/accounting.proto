syntax = "proto3";
package drl.v1;
option go_package = "github.com/gchiesa/drl/internal/proto";

message CounterEntry {
  fixed64 entity_hash = 1;
  uint64 hits = 2;
}

message CounterBatch {
  uint64 sender_id = 1;
  uint64 timestamp = 2;
  repeated CounterEntry entries = 3;
}

message BlockEvent {
  string key = 1;
  int64 ttl_nanos = 2;
  string entity_ip = 3;
  string entity_path = 4;
  map<string, string> entity_hdrs = 5;
}

message UnblockEvent {
  string key = 1;
}

message HandoverPayload {
  uint64 sender_id = 1;
  uint64 timestamp = 2;
  bytes compressed_entries = 3;  // zstd-compressed protobuf CounterBatch
  uint64 entity_count = 4;
}

message DrlMessage {
  oneof content {
    CounterBatch counters = 1;
    BlockEvent block = 2;
    UnblockEvent unblock = 3;
    HandoverPayload handover = 4;
  }
}
