services:
  echo-server:
    image: mccutchen/go-httpbin:latest
    networks:
      - test-network

  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: handover-envoy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    depends_on:
      drl:
        condition: service_healthy
    networks:
      - test-network

  drl:
    build:
      context: ../../
      dockerfile: Dockerfile
    volumes:
      - ./config/drl.kdl:/etc/drl/config.kdl:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 2
    # Give DRL sufficient time to complete its handover evacuation (default
    # handover timeout is 10 s) before Docker sends SIGKILL.
    stop_grace_period: 30s
    environment:
      DRL_CONFIG_PATH: /etc/drl/config.kdl
      DRL_PRIVATE_API_KEY: "TestHandoverKey!"
      DRL_MEMBERSHIP_PRIMARY_KEY: "abcdef0123456789"
      DRL_MEMBERSHIP_SECONDARY_KEYS: "0123456789012345"
    networks:
      - test-network

  k6:
    image: grafana/k6:latest
    user: root
    # Keep the container alive so both phases run from the same IP address.
    # DRL entity keys include the source IP, so reusing the container ensures
    # phase 2 entity keys match the accounting entries accumulated in phase 1.
    # Override entrypoint: k6 image defaults to the k6 binary, so we must use
    # /bin/sh to run sleep rather than passing it as a k6 subcommand.
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    environment:
      TARGET_URL: http://envoy:10000
    depends_on:
      - envoy
      - jumpbox
    networks:
      - test-network

  jumpbox:
    image: apteno/alpine-jq:latest
    container_name: jumpbox
    command: ["sleep", "infinity"]
    environment:
      DRL_PRIVATE_API_KEY: "TestHandoverKey!"
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
