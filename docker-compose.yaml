services:
  echo-server:
    image: mccutchen/go-httpbin:latest
    container_name: echo-server
    networks:
      - drl-network

  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: envoy
    ports:
      - "10000:10000"
    volumes:
      - ./deployments/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    depends_on:
      - echo-server
    networks:
      - drl-network

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - loadtest
    volumes:
      - ./deployments/k6:/scripts:ro
    environment:
      - TARGET_URL=http://envoy:10000
    command: ["run", "/scripts/load-test.js"]
    depends_on:
      - envoy
    networks:
      - drl-network

  drl:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DISCOVERY_SERVICE_NAME=drl
      - BIND_ADDR=0.0.0.0
      - STARTUP_DELAY=3s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
    networks:
      - drl-network

networks:
  drl-network:
    driver: bridge
