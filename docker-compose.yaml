services:
  echo-server:
    image: mccutchen/go-httpbin:latest
#    container_name: echo-server
    deploy:
      replicas: 3
    networks:
      - drl-network

#  static-responder:
#    image: nginx:alpine
#    container_name: static-responder
#    volumes:
#      - ./deployments/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
#    networks:
#      - drl-network

  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: envoy
    ports:
      - "10000:10000"
    volumes:
      - ./deployments/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    # command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info", "--component-log-level", "ext_authz:debug,connection:debug"]
    depends_on:
      - echo-server
      - drl
    networks:
      - drl-network

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles:
      - loadtest
    volumes:
      - ./deployments/k6:/scripts:ro
    environment:
      - TARGET_URL=http://envoy:10000
    command: ["run", "/scripts/load-test.js"]
    depends_on:
      - envoy
    networks:
      - drl-network

  drl:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./deployments/drl/config.kdl:/etc/drl/config.kdl:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
    environment:
      DRL_CONFIG_PATH: /etc/drl/config.kdl
      DRL_PRIVATE_API_KEY: "Test5ecretPrivateAPIKey!"
      DRL_MEMBERSHIP_PRIMARY_KEY: "abcdef0123456789"
      DRL_MEMBERSHIP_SECONDARY_KEYS: "0123456789012345"
    networks:
      - drl-network

  jumpbox:
    image: apteno/alpine-jq:latest
    container_name: jumpbox
    command: ["sleep", "infinity"]
    environment:
      DRL_PRIVATE_API_KEY: "Test5ecretPrivateAPIKey!"
    networks:
      - drl-network

networks:
  drl-network:
    driver: bridge
