---
# Envoy configuration — DRL is a sidecar, so we connect via 127.0.0.1
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: drl
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 10000
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          grpc_service:
                            envoy_grpc:
                              cluster_name: drl_cluster
                            timeout: 0.25s
                          transport_api_version: V3
                          failure_mode_allow: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: echo-server

      clusters:
        # echo-server is a sidecar — use loopback
        - name: echo-server
          connect_timeout: 5s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: echo-server
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8080
        # DRL is a sidecar — use loopback
        - name: drl_cluster
          connect_timeout: 0.25s
          type: STATIC
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: drl_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8081
---
# DRL configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: drl-config
  namespace: drl
data:
  config.kdl: |
    // DRL - Distributed Rate Limiter Configuration
    // K8s Sidecar deployment
    //
    // Peer discovery: DRL sidecars discover each other via the headless
    // K8s Service "drl-headless" which returns A records for all pod IPs.

    listen {
        grpc ":8081"
        metrics ":9091"
    }

    membership {
        service-name "drl-headless.drl.svc.cluster.local"
        port 7946
        bind-addr "0.0.0.0"
        startup-delay "3s"
    }

    logging {
        level "debug"
        format "text"
    }

    internal-api {
        enabled true
        address ":8082"
    }

    accounting {
        settings {
            algorithm "sliding-window"
            retry-after-type "delay-seconds"
        }
        rules {
            "catch-all" {
                path-prefix "/"
                limit 100
                per "minute"
            }
            "anything" {
                path-prefix "/anything"
                limit 10
                per "minute"
            }
        }
    }
