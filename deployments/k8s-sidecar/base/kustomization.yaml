apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: drl

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# Replace with your actual DRL image
images:
  - name: ghcr.io/gchiesa/drl
    newTag: latest

