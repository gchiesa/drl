apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: drl
  labels:
    app: echo-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      # Ensure DRL sidecar is ready before Envoy (init container approach avoids
      # Kubernetes sidecar ordering limitations on older clusters).
      initContainers:
        - name: wait-for-drl
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q --spider http://127.0.0.1:9091/health; do echo 'waiting for DRL...'; sleep 2; done"]

      containers:
        # ── echo-server ────────────────────────────────────────────────────────
        - name: echo-server
          image: mccutchen/go-httpbin:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

        # ── envoy sidecar ──────────────────────────────────────────────────────
        - name: envoy
          image: envoyproxy/envoy:v1.30-latest
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - name: http
              containerPort: 10000
              protocol: TCP
            - name: admin
              containerPort: 9901
              protocol: TCP
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

        # ── drl sidecar ────────────────────────────────────────────────────────
        - name: drl
          image: ghcr.io/your-org/drl:latest  # replace with your image
          args: ["serve"]
          env:
            - name: DRL_CONFIG_PATH
              value: /etc/drl/config.kdl
            - name: DRL_PRIVATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: drl-secrets
                  key: private-api-key
            - name: DRL_MEMBERSHIP_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: drl-secrets
                  key: membership-primary-key
            - name: DRL_MEMBERSHIP_SECONDARY_KEYS
              valueFrom:
                secretKeyRef:
                  name: drl-secrets
                  key: membership-secondary-keys
                  optional: true
          ports:
            - name: grpc
              containerPort: 8081
              protocol: TCP
            - name: internal-api
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
            - name: memberlist-tcp
              containerPort: 7946
              protocol: TCP
            - name: memberlist-udp
              containerPort: 7946
              protocol: UDP
          volumeMounts:
            - name: drl-config
              mountPath: /etc/drl
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
        - name: drl-config
          configMap:
            name: drl-config
