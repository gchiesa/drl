apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: drl
  labels:
    app: echo-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      containers:
        # ── echo-server ────────────────────────────────────────────────────────
        - name: echo-server
          image: mccutchen/go-httpbin:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

        # ── envoy sidecar ──────────────────────────────────────────────────────
        # Envoy connects to echo-server via localhost and to the DRL fleet
        # via the "drl" ClusterIP Service at drl.drl.svc.cluster.local:8081.
        - name: envoy
          image: envoyproxy/envoy:v1.30-latest
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - name: http
              containerPort: 10000
              protocol: TCP
            - name: admin
              containerPort: 9901
              protocol: TCP
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

      volumes:
        - name: envoy-config
          configMap:
            name: envoy-config
