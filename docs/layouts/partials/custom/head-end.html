{{/* Mermaid.js — loaded at end of <head> so it is available when the page renders.
     Pinned to a specific minor version for reproducibility.
     Detects the active Hextra color scheme (light/dark) and passes it to mermaid. */}}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';

  const isDark = () =>
    document.documentElement.classList.contains('dark') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches &&
     !document.documentElement.classList.contains('light'));

  mermaid.initialize({
    startOnLoad: true,
    theme: isDark() ? 'dark' : 'default',
  });
</script>
